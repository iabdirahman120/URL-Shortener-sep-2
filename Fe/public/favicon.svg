<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="shr.dk">
  <!--
    Skråstregen.

    Den gamle var et lilla lyn, som ikke havde noget med produktet at gøre og
    bar den farve, resten af siden er kommet væk fra.

    Et kort link er shr.dk/okt26. Skråstregen er det ene tegn, hvert eneste
    link har, og den er det sted, hvor det lange bliver til det korte. Den er
    samtidig simpel nok til at kunne læses ved 16 pixel, hvor et lyn bliver
    til en klat.
  -->
  <rect width="32" height="32" rx="7" fill="#12503a"/>
  <path d="M20.5 8.5 11.5 23.5" stroke="#faf8f4" stroke-width="4.4" stroke-linecap="round"/>
</svg>
